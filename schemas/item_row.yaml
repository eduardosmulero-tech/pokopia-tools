# Definicion declarativa de la fila de item de 68 B — entrada #983 del contenedor KTGL.
#
# Fuente de las cifras: tools/spec/measure_item_row.py  (salida literal en
# informes/t_08c3f16a/medicion.txt).  Ningun nombre de contenido del juego: los campos
# se nombran por posicion y comportamiento, no por lo que el juego llama.
#
# Reglas de este fichero:
#   - `fields` debe cubrir la fila entera sin huecos ni solapes (lo comprueba el cargador).
#   - Cada campo declara `confidence`: measured | inferred | unknown, y su `evidence`.
#   - Anadir un campo = editar este YAML.  No hace falta tocar Python.
#   - Para un campo nuevo: offset, length, type y, si aplica, min/max/values/must_be_zero.
#
# Nota de lectura: la fila es una mezcla de u16 y u8; no es uniforme.  Donde el valor
# maximo medido pasa de 255 el ancho u16 es forzoso (un u8 no lo representaria), y eso
# queda anotado en `width_forcing`.

schema_version: 1

table:
  entry: 983
  label: item_row
  header_bytes: 64
  row_bytes: 68
  rows_expected: 4600
  evidence: "tools/spec/measure_item_row.py §1: 312864 B = 64 + 4600*68, count 4600, version 3"
  header:
    - {offset: 0, type: u32, length: 4, name: count, expected: 4600,
       evidence: "measure §1; cabecera no nula solo en count y version"}
    - {offset: 4, type: u32, length: 4, name: version, expected: 3,
       evidence: "measure §1"}
    - {offset: 8, type: reserved, length: 56, name: header_padding, must_be_zero: true,
       evidence: "measure §1: bytes 8..63 todos cero en esta build"}

# Predicado de fila vacia.  Se comprueba en los dos sentidos:
#   (contenido vacio)  <=>  (key_flag == value)
# Contenido vacio = `zero_ranges` a cero y el centinela en su sitio.  El byte de clase
# (+42) queda FUERA de `zero_ranges` a proposito: asi su valor es un dato independiente
# y la equivalencia es una prueba real, no una tautologia.
empty_row:
  zero_ranges:
    - [0, 32]
    - [34, 42]
    - [43, 68]
  sentinel: {offset: 32, length: 2, value: 9999}
  key_flag: {offset: 42, length: 1, value: 0}
  measured:
    rows_empty: 769
    marker_9999_rows: 1022
    equivalence: "las 769 filas con +42 == 0 son exactamente las 769 vacias por contenido"
    evidence: "measure §2"


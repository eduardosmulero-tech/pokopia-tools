# Grupos = valor de (+42, +43).  Se describen por comportamiento medido, no por
# contenido.  El validador comprueba que todo (42, 43) observado cae en un grupo
# declarado; los recuentos se contrastan con los medidos.
groups:
  - id: empty
    match: {42: 0, 43: 0}
    rows_measured: 769
    behaviour: "vacia: todo cero salvo el centinela 9999 en +32"
  - id: class_1_0
    match: {42: 1, 43: 0}
    rows_measured: 2628
    behaviour: >-
      clase mayoritaria.  +8 con 14 escalones (1 domina, 1094 filas), +58 de 1 a 15,
      +12 no nulo en 2365 de 2628, +22 no nulo en 363, +32 casi siempre 9600/9900/9700.
  - id: class_10_0
    match: {42: 10, 43: 0}
    rows_measured: 522
    behaviour: >-
      +8 con 12 escalones (1 domina, 204), +58 de 1 a 18, +12 no nulo en 475 de 522,
      +22 no nulo en 62, +40 siempre 0, +32 con 9999 en 224 (la unica clase donde el
      centinela convive con datos).
  - id: class_1_1
    match: {42: 1, 43: 1}
    rows_measured: 479
    behaviour: >-
      +8 concentrado en 100 (326 filas) y 50 (76), +58 clavado en {6, 7} (479 de 479),
      +12 no nulo en solo 65, +22 siempre 0, +32 sin valor dominante (casi unico por fila).
  - id: class_9_0
    match: {42: 9, 43: 0}
    rows_measured: 118
    behaviour: >-
      +8 = 10 en 103 filas, +58 = 2 en 100, +12 no nulo en 115 de 118, +32 = 4000 en 100,
      +22 no nulo en 5.
  - id: class_10_1
    match: {42: 10, 43: 1}
    rows_measured: 83
    behaviour: >-
      +8 = 100 en 71 filas, +58 = 7 en las 83, +12 no nulo en solo 15, +22 siempre 0,
      +40 no nulo en 10, +32 sin valor dominante.
  - id: class_9_1
    match: {42: 9, 43: 1}
    rows_measured: 1
    behaviour: "una sola fila; perfil de class_10_1 (+58 = 7, +8 = 100)"

# Invariantes globales que el validador comprueba ademas de los limites de campo.
invariants:
  - id: cover_row
    kind: tiling
    description: "los campos cubren 0..67 sin huecos ni solapes"
  - id: header_consistent
    kind: header
    description: "count y version de la cabecera iguales a lo declarado y tamano = 64 + count*68"
  - id: empty_coherent
    kind: empty_row_bidirectional
    description: "(vacia por contenido) <=> (+42 == 0)"
  - id: groups_exhaustive
    kind: groups
    description: "todo par (42, 43) observado pertenece a un grupo declarado"
  - id: reference_bounds
    kind: reference
    description: "todo campo con `reference` cabe en el limite de la tabla destino"
